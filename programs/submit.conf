# SubMIT central configuration (sourced by shell scripts; parsed by python)
# DELTAT: data/GF sampling interval in seconds. Smaller events with shorter
# durations may need finer dt. Currently honored by: gen_par.py (Par.file
# deltat), gf loc genfk.sh (fk -N), gf tel mtel3.pl (via SUBMIT_DELTAT env).
# NOT yet automatic (edit by hand if you change DELTAT):
#   - MyExtractSeed.sh / MyExtractSeed_loc.sh decimate tables (target 1 sps)
#   - sub_header.h maxnpts=500 (window_npts = (nd_time-bg_time)/DELTAT must fit)
#   - fwd_SubMIT plotting scripts assume the Par.file dt via SAC headers
DELTAT=1
